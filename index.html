        /* ==========================================================================
   GAME SPLASH SCREEN STYLES
   ========================================================================== */
.splash-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at center, #1E1B4B 0%, #0F172A 100%);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    transition: opacity 0.6s ease, visibility 0.6s ease;
}

.splash-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.splash-content {
    animation: zoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

.game-badge {
    display: inline-block;
    padding: 0.4rem 1.2rem;
    background: rgba(99, 102, 241, 0.2);
    border: 1px solid #6366F1;
    color: #818CF8;
    border-radius: 50px;
    font-weight: 800;
    font-size: 0.85rem;
    letter-spacing: 2px;
    margin-bottom: 1.5rem;
}

.game-title {
    font-size: 4rem;
    font-weight: 900;
    letter-spacing: -2px;
    color: #FFFFFF;
    text-shadow: 0 0 30px rgba(99, 102, 241, 0.6);
    margin-bottom: 0.5rem;
}

.game-subtitle {
    color: #94A3B8;
    font-size: 1.1rem;
    margin-bottom: 2.5rem;
}

.btn-game-start {
    background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
    color: white;
    font-weight: 800;
    font-size: 1.2rem;
    padding: 1.2rem 3rem;
    border-radius: 50px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 25px rgba(124, 58, 237, 0.5);
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    cursor: pointer;
    transition: all 0.25s ease;
    animation: pulse 2s infinite;
}

.btn-game-start:hover {
    transform: scale(1.08);
    box-shadow: 0 0 35px rgba(124, 58, 237, 0.8);
}

.game-footer-text {
    margin-top: 2rem;
    color: #64748B;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
}

@keyframes zoomIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}
        /* ==========================================================================
           DESIGN SYSTEM & VARIABLES
           ========================================================================== */
        :root {
            --primary: #1E3A8A;
            --primary-light: #3B82F6;
            --secondary: #0D9488;
            --amber: #D97706;
            --bg-main: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.05);
            --shadow-lg: 0 20px 30px -10px rgba(0,0,0,0.08);
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 80px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
            border: none;
            background: none;
            cursor: pointer;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* ==========================================================================
           HEADER & NAVIGATION
           ========================================================================== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--primary);
        }

        .brand-author {
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(30, 58, 138, 0.08);
            color: var(--primary);
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            margin-left: 0.5rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-btn {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .nav-btn:hover, .nav-btn.active {
            color: var(--primary);
            background-color: rgba(59, 130, 246, 0.08);
        }

        .search-trigger {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.875rem;
            color: var(--text-muted);
            width: 220px;
            cursor: pointer;
        }

        /* ==========================================================================
           HERO SECTION
           ========================================================================== */
        .hero {
            padding: 4rem 0 2.5rem;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 3rem;
            align-items: center;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 1.25rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .hero-actions {
            display: flex;
            gap: 1rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            padding: 0.85rem 1.75rem;
            border-radius: 50px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 14px rgba(30, 58, 138, 0.3);
            transition: var(--transition);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background-color: #1a3278;
        }

        .btn-secondary {
            background-color: white;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.85rem 1.75rem;
            border-radius: 50px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .btn-secondary:hover {
            background-color: var(--bg-main);
        }

        .daily-card {
            background: linear-gradient(135deg, #1E3A8A 0%, #0F172A 100%);
            color: white;
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .daily-tag {
            background: rgba(255, 255, 255, 0.15);
            padding: 0.35rem 0.8rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .daily-refresh-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            color: rgba(255, 255, 255, 0.7);
            transition: var(--transition);
        }

        .daily-refresh-btn:hover {
            color: white;
            transform: rotate(180deg);
        }

        /* ==========================================================================
           QUICK ACCESS CARDS
           ========================================================================== */
        .quick-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .quick-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: var(--radius-md);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            cursor: pointer;
        }

        .quick-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-light);
        }

        .quick-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ==========================================================================
           RESOURCE LIBRARY & CARDS
           ========================================================================== */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            background: white;
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }

        .select-filter {
            padding: 0.6rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background-color: var(--bg-main);
            font-family: inherit;
            font-size: 0.875rem;
            outline: none;
        }

        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .resource-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
            position: relative;
        }

        .resource-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .card-pills {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .badge-pill {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            background-color: var(--bg-main);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .badge-skill {
            background-color: rgba(30, 58, 138, 0.08);
            color: var(--primary);
            border-color: transparent;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .card-desc {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
            font-size: 0.8rem;
        }

        .btn-open {
            color: var(--primary-light);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: var(--transition);
        }

        .btn-open:hover {
            gap: 0.6rem;
        }

        .fav-star {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            color: var(--border);
            cursor: pointer;
            transition: var(--transition);
        }

        .fav-star.active {
            color: var(--amber);
            fill: var(--amber);
        }

        /* ==========================================================================
           ROADMAP / STUDY PLAN
           ========================================================================== */
        .roadmap-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .roadmap-step {
            background: white;
            border-left: 4px solid var(--primary);
            padding: 1.5rem;
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ==========================================================================
           FOOTER
           ========================================================================== */
        .footer {
            margin-top: 5rem;
            border-top: 1px solid var(--border);
            padding: 2.5rem 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .footer-author {
            color: var(--primary);
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .hero-grid { grid-template-columns: 1fr; }
            .hero-title { font-size: 2.25rem; }
            .nav-links { display: none; }
        }
    </style>
</head>

}

// Gọi hàm tải dữ liệu khi trang web vừa mở
window.addEventListener('DOMContentLoaded', loadVocabJSON);

function startAdvancedQuizScreen(container) {
    // Lấy danh sách các tài liệu duy nhất có từ vựng trong file JSON
    const availableSources = [...new Set(globalVocabData.map(item => item.sourceTitle))];

    container.innerHTML = `
        <div class="quiz-container" style="text-align: center;">
            <h1 style="font-size: 2rem; color: var(--primary); margin-bottom: 0.5rem;">🎮 Vocab Challenge Mode</h1>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Chọn bộ từ vựng theo file tài liệu để bắt đầu kiểm tra.</p>

            <div style="max-width: 400px; margin: 0 auto 2rem;">
                <label style="display: block; text-align: left; font-weight: 700; margin-bottom: 0.5rem;">Chọn nguồn tài liệu:</label>
                <select id="quizSourceSelect" class="select-filter" style="width: 100%; padding: 0.8rem;">
                    <option value="ALL">Tất cả tài liệu (Ngẫu nhiên)</option>
                    ${availableSources.map(src => `<option value="${src}">${src}</option>`).join('')}
                </select>
            </div>

            <button class="btn-primary" style="margin: 0 auto;" onclick="initQuizSession()">
                <i data-lucide="play"></i> Bắt Đầu Làm Bài
            </button>
        </div>
    `;
    lucide.createIcons();
}

function initQuizSession() {
    const selectedSource = document.getElementById('quizSourceSelect')?.value || 'ALL';
    
    // Lọc từ vựng theo file được chọn
    let filteredVocab = selectedSource === 'ALL' 
        ? globalVocabData 
        : globalVocabData.filter(item => item.sourceTitle === selectedSource);

    if (filteredVocab.length < 3) {
        alert("Bộ từ vựng của file này chưa đủ số lượng câu hỏi. Vui lòng chọn file khác hoặc bổ sung thêm vào vocab.json!");
        return;
    }

    // Trộn ngẫu nhiên danh sách câu hỏi
    const shuffled = [...filteredVocab].sort(() => 0.5 - Math.random());
    
    quizState.questions = shuffled.slice(0, 5).map(item => {
        // Lấy 3 lựa chọn sai ngẫu nhiên
        const wrongOptions = globalVocabData
            .filter(d => d.word !== item.word)
            .sort(() => 0.5 - Math.random())
            .slice(0, 3)
            .map(d => d.meaning);

        const allOptions = [...wrongOptions, item.meaning].sort(() => 0.5 - Math.random());

        return {
            word: item.word,
            pos: item.pos,
            correct: item.meaning,
            options: allOptions,
            example: item.example,
            source: item.sourceTitle
        };
    });

    quizState.currentIndex = 0;
    quizState.score = 0;
    quizState.answered = false;

    renderQuizQuestion(document.getElementById('mainContent'));
}

function renderQuizQuestion(container) {
    const q = quizState.questions[quizState.currentIndex];

    // Màn hình kết thúc lượt Quiz
    if (!q) {
        container.innerHTML = `
            <div class="quiz-container" style="text-align: center;">
                <h1 style="font-size: 2.2rem; color: var(--primary); margin-bottom: 0.5rem;">🎉 Hoàn Thành Lượt Kiểm Tra!</h1>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Kết quả luyện tập dựa trên file tài liệu đã chọn.</p>
                
                <div style="font-size: 3.5rem; font-weight: 800; color: var(--secondary); margin-bottom: 1rem;">
                    ${quizState.score} / ${quizState.questions.length}
                </div>
                
                <p style="font-size: 1.1rem; font-weight: 600; margin-bottom: 2rem;">
                    ${quizState.score === 5 ? "🏆 Band 8.5+ Vocab Master!" : quizState.score >= 3 ? "👍 Tốt! Hãy duy trì phong độ!" : "💪 Hãy ôn tập lại file tài liệu này nhé!"}
                </p>

                <button class="btn-primary" style="margin: 0 auto;" onclick="startAdvancedQuizScreen(document.getElementById('mainContent'))">
                    <i data-lucide="rotate-ccw"></i> Chọn Bộ Từ Vựng Khác
                </button>
            </div>
        `;
        lucide.createIcons();
        return;
    }

    container.innerHTML = `
        <div class="quiz-container">
            <div class="quiz-header">
                <span style="font-size: 0.8rem; font-weight: 700; color: var(--primary-light); text-transform: uppercase;">
                    📂 Nguồn: ${q.source}
                </span>
                <span class="quiz-score-badge">Score: ${quizState.score}</span>
            </div>

            <div style="margin-bottom: 1rem;">
                <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 700;">Câu ${quizState.currentIndex + 1}/${quizState.questions.length}: Chọn nghĩa đúng của từ</span>
                <h2 class="quiz-question-title">"${q.word}" <small style="font-size: 1rem; color: var(--text-muted);">(${q.pos})</small></h2>
            </div>

            <div class="quiz-options" id="quizOptions">
                ${q.options.map(opt => `
                    <button class="quiz-option-btn" onclick="checkQuizAnswer(this, '${opt.replace(/'/g, "\\'")}', '${q.correct.replace(/'/g, "\\'")}')">
                        ${opt}
                    </button>
                `).join('')}
            </div>

            <div id="quizFeedback" style="min-height: 50px;"></div>

            <button id="quizNextBtn" class="btn-primary quiz-next-btn" style="display: none;" onclick="nextQuizQuestion()">
                Câu Tiếp Theo <i data-lucide="arrow-right"></i>
            </button>
        </div>
    `;
    lucide.createIcons();
}
    </script>
</body>
</html>
