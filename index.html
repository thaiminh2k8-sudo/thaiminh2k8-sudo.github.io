<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Resources & Daily Challenge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        h1, h2 {
            color: #1a73e8;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #fafafa;
        }
        .card h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .tag {
            display: inline-block;
            padding: 3px 8px;
            font-size: 12px;
            color: #fff;
            background-color: #1a73e8;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>IELTS Learning Hub</h1>

    <!-- DAILY CHALLENGE SECTION -->
    <div class="card" id="daily-challenge">
        <span class="tag" id="challenge-tag">Loading...</span>
        <h3 id="challenge-title">Loading...</h3>
        <p><strong id="challenge-meaning"></strong></p>
        <p id="challenge-example"></p>
        <p id="challenge-extra" style="color: #666; font-size: 14px;"></p>
        <button class="btn" onclick="nextChallenge()">Đổi thử thách</button>
    </div>

    <h2>Tài liệu IELTS</h2>
    <div id="resources-list"></div>
</div>

<script>
    // --- DAILY CHALLENGES DATA ---

        {
            tag: "Word of the Day",
            title: "Meticulous (adj)",
            meaning: "Tỉ mỉ, cẩn trọng từng chi tiết nhỏ.",
            example: "\"She is meticulous about keeping her study notes organized.\"",
            extra: "💡 Đồng nghĩa: Thorough, Precise | Trái nghĩa: Careless"
        },
        {
            tag: "Writing Task 2 Tip",
            title: "Tránh dùng từ quá tuyệt đối",
            meaning: "Hạn chế dùng always, never, completely trong bài luận.",
            example: "\"Instead of 'Tech always improves lives', use 'Tech tends to improve lives'.\"",
            extra: "💡 Mẹo: Sử dụng modal verbs (may, could) hoặc adverbs (likely, often) để câu văn mang tính học thuật."
        },
        {
            tag: "Speaking Part 1 Question",
            title: "Topic Accommodation",

            example: "\"I'd say my bedroom is my absolute favorite spot because it's my own sanctuary.\"",

        },
        {
            tag: "Collocation of the Day",
            title: "Make a strong impression on somebody",
            meaning: "Tạo ấn tượng mạnh mẽ với ai đó.",
            example: "\"His eloquent speech made a strong impression on the examiners.\"",
            extra: "💡 Cụm từ rất hữu ích cho Speaking Part 2 và Writing Task 2."
        },
        {
            tag: "Grammar Spotlight",
            title: "Đảo ngữ với 'Not only ... but also'",
            meaning: "Nhấn mạnh hai hành động/đặc tính cùng lúc.",
            example: "\"Not only did he pass the exam, but he also achieved an 8.0 overall.\"",
            extra: "💡 Cấu trúc: Not only + Trợ động từ + S + V, but S + also + V."
        },
        {
            tag: "Pronunciation Challenge",
            title: "Phân biệt âm /θ/ vs /ð/",
            meaning: "Cách đặt lưỡi giữa hai răng để phát âm chuẩn âm 'th'.",

        }

    let currentChallengeIndex = 0;

    function displayChallenge(index) {
        const item = DAILY_CHALLENGES[index];
        document.getElementById('challenge-tag').innerText = item.tag;
        document.getElementById('challenge-title').innerText = item.title;
        document.getElementById('challenge-meaning').innerText = item.meaning;
        document.getElementById('challenge-example').innerText = item.example;
        document.getElementById('challenge-extra').innerText = item.extra;
    }

    function nextChallenge() {
        currentChallengeIndex = (currentChallengeIndex + 1) % DAILY_CHALLENGES.length;
        displayChallenge(currentChallengeIndex);
    }

    function renderResources() {
        const container = document.getElementById('resources-list');
        container.innerHTML = RESOURCES_DATA.map(res => `
            <div class="card">
                <span class="tag">${res.category}</span>
                <h3>${res.title}</h3>
                <p><strong>Cấp độ:</strong> ${res.level} | <strong>Thời lượng:</strong> ${res.duration}</p>
                <p>${res.description}</p>
                <a href="${res.url}" target="_blank" class="btn" style="text-decoration:none; display:inline-block;">Xem tài liệu</a>
            </div>
        `).join('');
    }

    // Initialize
    displayChallenge(0);
    renderResources();
</script>

</body>
</html>
