<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Resources & Daily Challenge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        h1, h2 {
            color: #1a73e8;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #fafafa;
        }
        .card h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .tag {
            display: inline-block;
            padding: 3px 8px;
            font-size: 12px;
            color: #fff;
            background-color: #1a73e8;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #1557b0;
        }

        document.getElementById('challenge-extra').innerText = item.extra;
    }

                <a href="${res.url}" target="_blank" class="btn" style="text-decoration:none; display:inline-block;">Xem tài liệu</a>
